name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      # Validateur officiel de Google : le cadran doit respecter le Watch Face Format v1
      - name: Valider le cadran (Watch Face Format)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/wff-validator.jar" https://github.com/google/watchface/releases/download/release/wff-validator.jar
          java -jar "$RUNNER_TEMP/wff-validator.jar" 1 watchface/src/main/res/raw/watchface.xml

      - name: Compiler les APK de debug (app et cadran)
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Lint Android
        run: ./gradlew lintDebug

      # Non signée ici : vérifie seulement que R8 (minification) passe avant de pousser un tag
      - name: Compiler la release
        run: ./gradlew assembleRelease

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-watch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publier l'APK du cadran
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-watch-face-debug
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          retention-days: 14

      - name: Publier le rapport de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

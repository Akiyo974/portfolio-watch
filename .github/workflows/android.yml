name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK de debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest

      - name: Lint Android
        run: ./gradlew lintDebug

      # Non signée ici : vérifie seulement que R8 (minification) passe avant de pousser un tag
      - name: Compiler la release
        run: ./gradlew assembleRelease

      - name: Publier l'APK
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-watch-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publier le rapport de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
